# 扫描器拦截 —— 由 vhost 用 include 引入
# 依赖 conf.d/meihua-guard.conf 里的 $meihua_bad_ua 变量

# UA 命中黑名单：直接断连（444 不回响应，比 403 更省资源）
if ($meihua_bad_ua) {
    return 444;
}

# 站点不存在这些路径，出现即为探测
location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma|adminer|myadmin|\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.DS_Store|config\.json|backup|bak/|db\.|dump|vendor/|cgi-bin/|server-status|actuator|solr/|console) {
    access_log off;
    return 444;
}

# 本站没有动态脚本与备份文件
location ~* \.(php|asp|aspx|jsp|cgi|pl|sh|sql|bak|old|swp|save|ini|log)$ {
    access_log off;
    return 444;
}
