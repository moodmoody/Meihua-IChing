# 备选反代：Nginx（不用 Caddy 时）
# /etc/nginx/conf.d/meihua.conf
server {
    listen 80;
    server_name meihua.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meihua.example.com;

    ssl_certificate     /etc/letsencrypt/live/meihua.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meihua.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：禁用缓冲与超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 字体分片可长缓存
    location /fonts/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
