# 扫描器拦截：UA 特征表（http 上下文）
# 被 /etc/nginx/sites-available/meihua 引用

map $http_user_agent $meihua_bad_ua {
    default 0;

    # 空 UA：正常浏览器不会这样
    ""      1;

    # 漏洞扫描器 / 爬虫框架
    ~*(zgrab|masscan|nmap|sqlmap|nikto|nuclei|wpscan|dirbuster|gobuster|feroxbuster|ffuf|wfuzz)  1;
    ~*(acunetix|nessus|openvas|qualys|netsparker|appscan|burp)                                  1;

    # 测绘与批量抓取
    ~*(censys|shodan|internetmeasurement|expanse|binaryedge|leakix)                             1;
    ~*(python-requests|go-http-client|java/|libwww-perl|okhttp.*scanner)                        1;
}
